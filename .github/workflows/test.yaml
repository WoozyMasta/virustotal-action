name: Test

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run prettier:check

      - name: Build action bundle
        run: npm run build

      - name: Verify committed dist
        shell: bash
        run: |
          test -s dist/index.js
          git diff --exit-code -- dist/
          test -z "$(git status --porcelain dist/)"

  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate workflows
        uses: docker://rhysd/actionlint:1.7.12
